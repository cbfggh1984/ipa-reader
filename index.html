<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>英语音标点读 · 真人发音</title>
<style>
  :root{
    --blue:#2563eb; --red:#e63946;
    --cons:#2a9d8f;
    --ink:#22303c; --muted:#7a8b99;
    --bg:#f4f7fa; --radius:12px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:30px;
  }
  header{
    background:linear-gradient(135deg,#2563eb,#7c3aed);
    color:#fff; padding:18px 16px 16px; border-radius:0 0 22px 22px;
    box-shadow:0 4px 14px rgba(37,99,235,.25); text-align:center;
  }
  header h1{margin:0;font-size:21px;font-weight:700;}
  header p{margin:6px 0 0;font-size:13px;opacity:.92;}
  .wrap{max-width:720px;margin:0 auto;padding:0 12px;}
  .sec{margin-top:18px;}
  .sec-title{
    font-size:15px;font-weight:700;color:var(--ink);
    display:flex;align-items:center;gap:8px;margin:0 2px 10px;
  }
  .sec-title .tag{font-size:11px;font-weight:600;padding:2px 8px;border-radius:20px;background:#e3efff;color:#1d6fd1;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;}
  @media(max-width:380px){.grid{gap:6px;}}
  .card{
    background:#fff;border-radius:var(--radius);
    padding:14px 4px 10px;text-align:center;
    box-shadow:0 1px 3px rgba(0,0,0,.07);
    cursor:pointer;user-select:none;
    border:2px solid transparent;
    transition:transform .1s;
  }
  .card:active{transform:scale(.93);}
  .card.playing{border-color:var(--red);background:#fff5f5;}
  .symbol{
    font-size:30px;font-weight:700;line-height:1.1;
    font-family:"Times New Roman",Georgia,serif;color:var(--red);
    white-space:nowrap;
  }
  .card.c .symbol{color:var(--cons);}
  .cn{font-size:11px;color:var(--muted);margin-top:5px;white-space:nowrap;}
  .toolbar{
    display:flex;justify-content:center;gap:10px;margin-top:20px;
  }
  .tb{
    border:none;border-radius:10px;padding:10px 18px;
    font-size:14px;font-weight:600;cursor:pointer;color:#fff;
    background:var(--blue);
  }
  .tb.off{background:#94a3b8;}
  footer{text-align:center;color:#aeb8c2;font-size:12px;margin-top:24px;line-height:1.7;}
  #toast{
    position:fixed;left:50%;bottom:70px;transform:translateX(-50%);
    background:rgba(34,48,60,.92);color:#fff;
    padding:10px 20px;border-radius:24px;font-size:15px;
    opacity:0;transition:opacity .2s;pointer-events:none;z-index:99;white-space:nowrap;
  }
  #toast.show{opacity:1;}
</style>
</head>

const MONO = [["iː", "ɪ", "e", "æ"], ["ɑː", "ɒ", "ɔː", "ʊ"], ["uː", "ʌ", "ɜː", "ə"]];
const DIP = [["eɪ", "aɪ", "ɔɪ", "əʊ"], ["aʊ", "ɪə", "eə", "ʊə"]];
const CONS = [["p", "b", "t", "d"], ["k", "ɡ", "f", "v"], ["s", "z", "θ", "ð"], ["ʃ", "ʒ", "tʃ", "dʒ"], ["tr", "dr", "ts", "dz"], ["m", "n", "ŋ", "h"], ["l", "r", "w", "j"]];
const HINTS = {"iː": "长\"衣\"咧嘴", "ɪ": "短\"衣\"放松", "e": "扁嘴\"哎\"", "æ": "张大嘴\"哎\"", "ɑː": "长\"啊\"", "ɒ": "短\"哦\"", "ɔː": "长\"奥\"", "ʊ": "短\"乌\"", "uː": "长\"乌\"", "ʌ": "短\"阿\"", "ɜː": "长\"额\"", "ə": "轻\"呃\"", "eɪ": "\"诶\"", "aɪ": "\"爱\"", "ɔɪ": "\"奥衣\"", "əʊ": "\"欧\"", "aʊ": "\"傲\"", "ɪə": "\"衣儿\"", "eə": "\"爱儿\"", "ʊə": "\"乌儿\"", "p": "\"泼\"", "b": "\"波\"", "t": "\"特\"", "d": "\"得\"", "k": "\"克\"", "ɡ": "\"格\"", "f": "上齿\"夫\"", "v": "上齿\"呜\"", "s": "\"丝\"", "z": "\"资\"", "θ": "咬舌\"丝\"", "ð": "咬舌\"滋\"", "ʃ": "\"诗\"", "ʒ": "\"日\"", "tʃ": "\"吃\"", "dʒ": "\"知\"", "tr": "\"戳\"", "dr": "\"捉\"", "ts": "\"次\"", "dz": "\"滋\"", "m": "\"姆\"", "n": "\"呢\"", "ŋ": "鼻音\"嗯\"", "h": "\"喝\"", "l": "\"勒\"", "r": "卷舌\"若\"", "w": "圆唇\"呜\"", "j": "\"耶\""};

let slow = false;
const cache = {};
let curCard = null, curAudio = null;
let audioCtx = null;          // Web Audio 兜底
const blobUrls = {};

/* base64 -> Blob -> URL（兼容微信X5/安卓浏览器，data URI 在这些环境不可靠） */
function b64ToBlobUrl(b64){
  const bin = atob(b64);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for(let i=0;i<len;i++) bytes[i] = bin.charCodeAt(i);
  const blob = new Blob([bytes], {type:'audio/mpeg'});
  return URL.createObjectURL(blob);
}

function getBlobUrl(ipa){
  if(!blobUrls[ipa]) blobUrls[ipa] = b64ToBlobUrl(AUDIO[ipa]);
  return blobUrls[ipa];
}

/* 用 Web Audio 解锁并播放（最稳的方案） */
function ensureCtx(){
  if(!audioCtx){
    const AC = window.AudioContext || window.webkitAudioContext;
    if(AC) audioCtx = new AC();
  }
  if(audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}

function playViaCtx(ipa, card){
  return new Promise((resolve, reject)=>{
    const ctx = ensureCtx();
    if(!ctx) return reject('no-audio-context');
    fetch(getBlobUrl(ipa))
      .then(r => r.arrayBuffer())
      .then(buf => ctx.decodeAudioData(buf))
      .then(decoded => {
        if(curNode){ try{ curNode.stop(); }catch(e){} }
        const src = ctx.createBufferSource();
        src.buffer = decoded;
        src.playbackRate.value = slow ? 0.6 : 1.0;
        src.connect(ctx.destination);
        src.onended = ()=>{ if(card) card.classList.remove('playing'); };
        src.start();
        curNode = src;
        resolve(true);
      })
      .catch(()=>reject('decode-fail'));
  });
}
let curNode = null;

function getAudio(ipa){
  if(!cache[ipa]){
    cache[ipa] = new Audio(getBlobUrl(ipa));
    cache[ipa].preload = 'auto';
  }
  return cache[ipa];
}

function buildCard(ipa, isCons){
  const d = document.createElement('div');
  d.className = 'card' + (isCons ? ' c' : '');
  d.innerHTML = '<div class="symbol">[' + ipa + ']</div>' +
                '<div class="cn">' + (HINTS[ipa]||'') + '</div>';
  d.onclick = ()=>play(ipa, d);
  return d;
}

function fillGrid(id, rows, isCons){
  const g = document.getElementById(id);
  rows.flat().forEach(ipa=>g.appendChild(buildCard(ipa, isCons)));
}
fillGrid('g-mono', MONO, false);
fillGrid('g-dip', DIP, false);
fillGrid('g-cons', CONS, true);

function play(ipa, card){
  if(curAudio){ try{ curAudio.pause(); curAudio.currentTime = 0; }catch(e){} }
  if(curNode){ try{ curNode.stop(); }catch(e){} }
  if(curCard){ curCard.classList.remove('playing'); }
  ensureCtx();  // 首次点击解锁音频（手机要求用户手势）

  const tryAudioTag = ()=>{
    const a = getAudio(ipa);
    a.playbackRate = slow ? 0.6 : 1.0;
    const p = a.play();
    if(p && p.catch){
      p.then(()=>{ markPlaying(a, card); })
       .catch(()=>{
         // Audio标签失败 → Web Audio 兜底
         playViaCtx(ipa, card).then(ok=>{ curCard = card; })
           .catch(()=>showFailTip());
       });
    } else {
      markPlaying(a, card);
    }
  };
  tryAudioTag();

  curCard = card;
  toast('🔊 [' + ipa + ']');
}

function markPlaying(a, card){
  curAudio = a;
  card.classList.add('playing');
  a.onended = ()=>card.classList.remove('playing');
}

function showFailTip(){
  toast('⚠️ 无法播放：请点击右上角“…”用浏览器打开本页');
}

/* iOS/部分安卓：任何首次触摸都解锁音频 */
document.addEventListener('touchstart', ()=>ensureCtx(), {once:true, passive:true});
document.addEventListener('click', ()=>ensureCtx(), {once:true, passive:true});

function toggleSlow(){
  slow = !slow;
  const b = document.getElementById('btn-slow');
  b.textContent = slow ? '🐢 慢速: 开' : '🐢 慢速: 关';
  b.classList.toggle('off', !slow);
  toast(slow ? '已开启慢速发音' : '已恢复正常语速');
}

let toastTimer=null;
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),1200);
}
</script>
